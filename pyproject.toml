[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-notes-rag"
version = "0.1.0"
description = "Local document retrieval with verifiable evidence spans"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "numpy>=2,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
margin-notes = "margin_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semantic: downloads and runs the real embedding model"]

[tool.ruff]
line-length = 100

